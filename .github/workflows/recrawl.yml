name: Scheduled source refresh

# Re-crawls data/sources/sources.yaml once a day, diffs each page against what is currently indexed
# (app/recrawl.py), and re-indexes only the sources whose content meaningfully changed. This is a
# separate workflow from eval.yml on purpose (see docs/adr/0004-ci-baselines-vs-aspirational-
# thresholds.md for the same reasoning applied there): this job never runs the eval, and it needs a
# real, reachable production database and a real embedder, neither of which the eval gate's CI
# invariant job has or needs.
#
# - `schedule`: a source can be rewritten at any time -- notably studyinthestates.dhs.gov and
#   ice.gov, which DHS has said will be rewritten to reflect the fixed-period-of-admission final
#   rule on and after Sept 15 2026 -- and a daily tick catches that within a day instead of whenever
#   someone happens to run `python -m app.recrawl` by hand.
# - `workflow_dispatch`: lets a person trigger a re-crawl on demand, e.g. right after a known rule
#   change, without waiting for the next scheduled tick.
"on":
  schedule:
    # 08:17 UTC, once a day. Not top-of-hour: GitHub throttles/delays jobs scheduled for the exact
    # hour under load, since every other repository's cron tends to fire then too.
    - cron: "17 8 * * *"
  workflow_dispatch:

jobs:
  refresh:
    name: Re-crawl sources and report what changed
    runs-on: ubuntu-latest
    env:
      # app/config.py's defaults for both of these are container-absolute paths (/app/data/...),
      # meaningful only inside the orchestrator's own Docker image. A checkout on ubuntu-latest has
      # neither path, so both must be pointed at the checkout explicitly -- the same way
      # eval.yml's ci-invariant-gate job sets RAW_SNAPSHOT_DIR from ${{ github.workspace }} rather
      # than relying on the container default.
      SOURCES_MANIFEST_PATH: ${{ github.workspace }}/data/sources/sources.yaml
      RAW_SNAPSHOT_DIR: ${{ github.workspace }}/data/sources/raw
      # Golden-set impact reporting (Phase 8 round 2, app/recrawl.py) -- read-only, same
      # checkout-relative override as the two paths above.
      GOLDEN_SET_PATH: ${{ github.workspace }}/eval/golden.jsonl
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/orchestrator/pyproject.toml

      # [freshness] pulls in LangGraph for the refresh graph itself (app/recrawl.py). Deliberately
      # NOT [eval] or [eval-ci]: this job never runs `python -m eval.run`, only the refresh job, so
      # it never needs ragas/langchain/openai/textstat at all.
      - name: Install orchestrator + freshness dependencies (no eval, no eval-ci)
        run: pip install -e "./services/orchestrator[dev,freshness]"

      # secrets.DATABASE_URL is unset wherever no hosted database secret has been configured for
      # this repository (e.g. a fork, or a checkout before the secret is added). The two steps
      # below are mutually exclusive on this output (`mode`): "dry-run" skips the crawl entirely
      # (see the next step for why), "live" runs the real refresh.
      #
      # The secret is read into an env var here, never interpolated directly into the shell script
      # (`${{ secrets.DATABASE_URL }}` inside `run:` would expand to raw script text before bash
      # ever sees it, so a value containing a quote, backtick, or `$(...)` could break the script or
      # execute as a command). Testing `$DATABASE_URL` as a shell variable instead avoids that.
      - name: Decide whether a real database is configured
        id: db
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "mode=dry-run" >> "$GITHUB_OUTPUT"
          else
            echo "mode=live" >> "$GITHUB_OUTPUT"
          fi

      # No DATABASE_URL secret yet -- do NOT fetch anything. Without a database there is nowhere
      # to read a diff baseline from, nowhere to write a result to, and nothing for the human-
      # readable report to describe -- so this step does nothing but explain that and exit 0,
      # rather than burn 14 real HTTP requests against government pages for a report with no
      # database to persist into. This is NOT about data/sources/raw/ being gitignored: the diff
      # itself is stateless now (app/recrawl.py::_diff_node reads its baseline from
      # `sources.last_indexed_body`, never from a snapshot file -- see
      # docs/adr/0014-stateless-recrawl-diff.md), so an empty/absent raw_dir on its own is no
      # longer a reason to skip anything once a database exists.
      - name: No database configured yet -- the scheduled refresh is inert (Phase 8 not landed)
        if: steps.db.outputs.mode == 'dry-run'
        run: |
          echo "No DATABASE_URL secret configured yet."
          echo "Skipping the crawl entirely: there is nowhere to read a diff baseline from or write"
          echo "a result to. This step is a deliberate no-op until a database exists."
          exit 0

      # Once Phase 8 stands up a hosted database and a hosted embedder, this step also needs
      # EMBED_PROVIDER (and its model) set to that hosted provider -- app/providers/embeddings.py's
      # HostedEmbedder is still an unimplemented seam today, so this branch cannot fully succeed
      # against a real DATABASE_URL until that lands. Left here, rather than removed, so the secret
      # can be added the moment Phase 8 is ready without a second edit to this file.
      # This step's exit code is what decides whether the JOB fails -- see app/recrawl.py::
      # RefreshReport.exit_code (a broken source, OR a meaningful change to a source golden rows
      # cite / whose golden impact could not be checked -- docs/adr/0009). The JSON it writes here
      # is the artifact uploaded below, unconditionally, so a red run is always fully diagnosable
      # from the Actions UI without re-running anything.
      - name: Re-crawl (live)
        id: recrawl
        if: steps.db.outputs.mode == 'live'
        working-directory: services/orchestrator
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m app.recrawl --json > recrawl-report.json

      # Same run_id as the step above (both default to today's UTC date -- app/recrawl.py::
      # run_refresh's own docstring), so every source is already terminal in the checkpoint file
      # and this SECOND invocation resumes/reports from it rather than re-fetching a single URL --
      # no extra load on any government source.
      #
      # `if: always() && ...`: the step above may itself exit non-zero (RefreshReport.exit_code --
      # a broken source, OR a meaningful change to a source golden rows cite / whose golden impact
      # could not be checked, see docs/adr/0009), and GitHub Actions skips every later step by
      # default once one has failed UNLESS its `if:` says otherwise -- exactly the case this report
      # most needs to be visible for. `steps.recrawl.outcome != 'skipped'` keeps this from running
      # when the step above never ran at all (mode == 'dry-run'). `|| true` on the python call:
      # this step is purely informational (the step
      # above already decided the job's real exit code), so its own exit code must never duplicate
      # or override that -- it exists only to put the human-readable table (which names every
      # meaningful change AND, at the top, unmissably, WHICH of the two red reasons applies if any
      # -- see RefreshReport.render_table) where a person actually looks first: the GitHub Actions
      # run summary.
      - name: Write the human-readable report to the job summary
        if: always() && steps.db.outputs.mode == 'live' && steps.recrawl.outcome != 'skipped'
        working-directory: services/orchestrator
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          python -m app.recrawl >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the refresh report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recrawl-report
          path: services/orchestrator/recrawl-report.json
          if-no-files-found: ignore
