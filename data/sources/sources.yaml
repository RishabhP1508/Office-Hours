    title: Fixed Time Period of Admission Final Rule FAQ
    topic: fixed_admission
    annotations:
      rule_effective_date: 2026-09-15
      federal_register: https://www.federalregister.gov/d/2026-14439
      # KNOWN STALE. Moved here VERBATIM so this step is reviewable as a pure move; corrected in a
      # separate diff (step 6 of the migration plan). Measured against the current snapshot, all
      # five labels named below are h4, not h3, and the real h3 layer (General, F Students, School
      # Officials) is not mentioned at all. The note went stale when DHS added a grouping level and
      # survived the re-fetch that invalidated it, because build_frontmatter preserves unknown keys
      # verbatim across a body rewrite. See REPORT.md, instrument table entry 32.
      heading_note: >-
        This page inverts the usual nesting. Individual FAQ questions are h2 while the group labels
        that contain them (Transition Period, Understanding the Admit Until Date, Extensions of
        Stay, Maintaining Status, Departure Period) are h3. Headings are preserved verbatim; a
        section chunker must not assume h2 outranks h3 on this page.
