# The source manifest: what to crawl, plus the hand-authored curator annotations that go with it.
#
# `url`, `title` and `topic` are crawl configuration. `annotations` is the curator block: values a
# human asserts, which ingest can never derive from the page. Until September 2026 these lived in
# the YAML frontmatter of data/sources/raw/*.md, which is GITIGNORED, so the only copies were on one
# laptop and in production database columns and a fresh clone produced a corpus with no dated chunks
# at all. They are tracked here now. See docs/adr/0014-stateless-recrawl-diff.md's amendment.
#
# This file is AUTHORITATIVE for these values: the daily re-crawl reads them from here and writes
# them to `sources` and `documents` on every run, so editing a value here and waiting for the next
# run (or running `python -m app.sync_annotations`) is how a curator change reaches production.
# Deleting a key writes NULL, which is how an annotation is removed.
#
# Known exception, deliberate: eval/fixtures/sources/ keeps its annotations in frontmatter. That
# corpus is self-contained by design (docs/adr/0004) and is itself tracked, so the problem above
# does not apply to it. See app/ingest.py::_ingest_from_snapshots.

