services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-officehours}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-officehours}
      POSTGRES_DB: ${POSTGRES_DB:-officehours}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/sql/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-officehours} -d ${POSTGRES_DB:-officehours}"]
      interval: 5s
      timeout: 5s
      retries: 10

  orchestrator:
    build:
      context: ./services/orchestrator
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-officehours}:${POSTGRES_PASSWORD:-officehours}@postgres:5432/${POSTGRES_DB:-officehours}"
      OLLAMA_BASE_URL: "${OLLAMA_BASE_URL:-http://host.docker.internal:11434}"
      EMBED_PROVIDER: "${EMBED_PROVIDER:-ollama}"
      EMBED_MODEL: "${EMBED_MODEL:-nomic-embed-text}"
      EMBED_DIM: "${EMBED_DIM:-768}"
      LLM_PROVIDER: "${LLM_PROVIDER:-ollama}"
      LLM_MODEL: "${LLM_MODEL:-qwen3.5-8k:latest}"
      OLLAMA_API_KEY: "${OLLAMA_API_KEY:-}"
      OLLAMA_CLOUD: "${OLLAMA_CLOUD:-false}"
      LLM_FALLBACK_PROVIDER: "${LLM_FALLBACK_PROVIDER:-}"
      LLM_FALLBACK_MODEL: "${LLM_FALLBACK_MODEL:-}"
      LLM_FALLBACK_BASE_URL: "${LLM_FALLBACK_BASE_URL:-}"
      LLM_FALLBACK_API_KEY: "${LLM_FALLBACK_API_KEY:-}"
      LLM_TIMEOUT_SECONDS: "${LLM_TIMEOUT_SECONDS:-600.0}"
      EMBED_TIMEOUT_SECONDS: "${EMBED_TIMEOUT_SECONDS:-180.0}"
      OLLAMA_KEEP_ALIVE: "${OLLAMA_KEEP_ALIVE:-60m}"
      OLLAMA_THINK: "${OLLAMA_THINK:-false}"
      EMBED_GGUF_PATH: "${EMBED_GGUF_PATH:-}"
      EMBED_GGUF_N_CTX: "${EMBED_GGUF_N_CTX:-2048}"
      EMBED_GGUF_THREADS: "${EMBED_GGUF_THREADS:-1}"
      RETRIEVAL_TOP_K: "${RETRIEVAL_TOP_K:-5}"
      RRF_K: "${RRF_K:-60}"
      HYBRID_CANDIDATE_POOL: "${HYBRID_CANDIDATE_POOL:-20}"
      NO_ANSWER_MAX_DISTANCE: "${NO_ANSWER_MAX_DISTANCE:-0.50}"
      CLARIFY_MIN_CONTENT_WORDS: "${CLARIFY_MIN_CONTENT_WORDS:-3}"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-lgtm:4318"
      OTEL_SERVICE_NAME: "office-hours-orchestrator"
      INGEST_MODE: "${INGEST_MODE:-fetch}"
      CRAWL_DELAY_SECONDS: "${CRAWL_DELAY_SECONDS:-2.0}"
      USER_AGENT: "${USER_AGENT:-OfficeHoursBot/0.1 (+https://github.com/office-hours; contact: set-a-real-contact-here)}"
      JUDGE_PROVIDER: "${JUDGE_PROVIDER:-nvidia}"
      JUDGE_BASE_URL: "${JUDGE_BASE_URL:-https://integrate.api.nvidia.com/v1}"
      JUDGE_API_KEY: "${JUDGE_API_KEY}"
      JUDGE_MODEL: "${JUDGE_MODEL:-nvidia/nemotron-3.5-lightning-30b-a3b}"
      JUDGE_REQUESTS_PER_MINUTE: "${JUDGE_REQUESTS_PER_MINUTE:-20}"
      JUDGE_MAX_RETRIES: "${JUDGE_MAX_RETRIES:-12}"
      ALLOWED_ORIGINS: "${ALLOWED_ORIGINS:-http://localhost:3000}"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
      SEMANTIC_CACHE_ENABLED: "${SEMANTIC_CACHE_ENABLED:-false}"
      SEMANTIC_CACHE_SIMILARITY_THRESHOLD: "${SEMANTIC_CACHE_SIMILARITY_THRESHOLD:-0.15}"
      CLASSIFIER_LLM_PROVIDER: "${CLASSIFIER_LLM_PROVIDER:-}"
      CLASSIFIER_LLM_MODEL: "${CLASSIFIER_LLM_MODEL:-}"
      DAILY_GENERATION_CAP: "${DAILY_GENERATION_CAP:-0}"
      SESSION_HASH_SALT: "${SESSION_HASH_SALT:-office-hours-dev-salt-change-in-production}"
      # Langfuse (Phase 8 round 4): off by default -- absent keys mean app/langfuse_telemetry.py
      # never constructs a client, so local dev and the CI invariant gate are unaffected either
      # way. Set all three in .env to opt in locally against a real Langfuse project.
      LANGFUSE_HOST: "${LANGFUSE_HOST:-}"
      LANGFUSE_PUBLIC_KEY: "${LANGFUSE_PUBLIC_KEY:-}"
      LANGFUSE_SECRET_KEY: "${LANGFUSE_SECRET_KEY:-}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/app/data
      - ./eval:/app/eval
    depends_on:
      postgres:
        condition: service_healthy

  otel-lgtm:
    image: grafana/otel-lgtm:latest
    ports:
      - "${GRAFANA_HOST_PORT:-3000}:3000"
      - "4317:4317"
      - "4318:4318"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Phase 7: the only thing the browser talks to from here on. Rate limits, redacts PII out of
  # the request body, times upstream calls out, and propagates one trace across both services --
  # see docs/adr/0007-go-python-split.md. The orchestrator's own CORS middleware is left in place
  # (services/orchestrator/app/main.py) so a direct call (curl, a script) still works during
  # development; this gateway answers the browser's preflight for its own /v1/* routes instead.
  gateway:
    build:
      context: ./services/gateway
    ports:
      - "8080:8080"
    environment:
      GATEWAY_LISTEN_ADDR: ":8080"
      ORCHESTRATOR_URL: "http://orchestrator:8000"
      REDIS_URL: "redis://redis:6379"
      RATE_LIMIT_BUCKET_CAPACITY: "${RATE_LIMIT_BUCKET_CAPACITY:-20}"
      RATE_LIMIT_REFILL_PER_SECOND: "${RATE_LIMIT_REFILL_PER_SECOND:-1}"
      UPSTREAM_TIMEOUT_SECONDS: "${UPSTREAM_TIMEOUT_SECONDS:-15}"
      # Empty by default: nothing sits in front of this gateway in docker-compose (8080 is
      # published directly), so X-Forwarded-For is ignored outright unless an operator sets this
      # deliberately. See .env.example's own comment on TRUSTED_PROXY_CIDRS.
      TRUSTED_PROXY_CIDRS: "${TRUSTED_PROXY_CIDRS:-}"
      ALLOWED_ORIGINS: "${ALLOWED_ORIGINS:-http://localhost:3000}"
      # Phase 8 round 4: SAME variable name and (by default) SAME value as the orchestrator's own
      # SESSION_HASH_SALT below -- see services/gateway/internal/middleware/session.go and
      # services/orchestrator/app/main.py::_client_session_hash for why GET /usage's
      # distinct_sessions needs this to make a real client hash the same way on both sides.
      SESSION_HASH_SALT: "${SESSION_HASH_SALT:-office-hours-dev-salt-change-in-production}"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-lgtm:4318"
      OTEL_SERVICE_NAME: "office-hours-gateway"
    depends_on:
      orchestrator:
        condition: service_started
      redis:
        condition: service_healthy

volumes:
  pgdata:
