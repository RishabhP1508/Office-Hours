# Fly.io app config for services/orchestrator (Python/FastAPI). CLAUDE.md's own repository layout
# lists a single `infra/deploy/fly.toml`; this project deploys two independent services
# (orchestrator + gateway), so it gets two clearly-named files instead --
# fly.orchestrator.toml and fly.gateway.toml, each its own `fly apps create` / `fly deploy`.
#
# DEPLOY FROM THE REPOSITORY ROOT, passing services/orchestrator as the directory argument:
#   fly deploy services/orchestrator --config infra/deploy/fly.orchestrator.toml
# Fly's `dockerfile` build option does not change the Docker build context, which defaults to
# wherever `fly deploy` is invoked from (https://fly.io/docs/reference/configuration/, "Specify a
# Dockerfile": "This option will not change the Docker context path... If you want the Dockerfile
# to use its containing directory as the context root, use `fly deploy <directory>`"). Passing
# `services/orchestrator` as the directory makes BOTH the build context and the Dockerfile lookup
# resolve to services/orchestrator/ -- exactly what services/orchestrator/Dockerfile already
# assumes (its COPY paths are the same ones docker-compose.yml's `build: context:
# ./services/orchestrator` already uses). flyctl finds `Dockerfile` in that directory by its own
# default, with no `dockerfile =` line needed here. [build.args] below IS needed, though: it is
# what makes this production build install the base runtime dependencies plus the one real
# embedding provider it needs (no ragas, no langchain, no langgraph, no datasets, no textstat --
# see services/orchestrator/Dockerfile's INSTALL_EXTRAS comment).
#
# `app` below is a placeholder -- Fly app names are globally unique across all Fly accounts, so
# whoever deploys this picks their own (e.g. `fly apps create office-hours-orchestrator-<handle>`)
# and edits this line to match before the first deploy.
#
# RED-TEAM FIX (2026-09-07), DEFECT C -- "this app is publicly reachable, bypassing the gateway
# entirely": https://oh-orchestrator-rp.fly.dev/query answers unauthenticated today, and so does
# /usage -- calling this hostname directly skips every protection the gateway enforces (the Redis
# rate limiter and its fallback, the question-length cap, PII redaction), simply because it is a
# second, un-gated path to the same service. Phase 7's own report already flagged exactly this
# ("in a real deployment only the gateway should be exposed").
#
# THE FIX BELOW: remove [http_service] -- the block that tells Fly's public Fly Proxy edge to
# route THIS app's allocated public IP to these machines -- and rely entirely on Fly's private 6PN
# networking instead, exactly what fly.gateway.toml's own ORCHESTRATOR_URL already uses
# ("http://oh-orchestrator-rp.internal:8000"). 6PN/`*.internal` DNS and machine-to-machine
# reachability inside one Fly organization do not depend on [http_service] being present, or on
# whether the app has a public IP allocated at all -- it is Fly's own private WireGuard mesh,
# always on between every app in the same org. Removing [http_service] removes the PUBLIC route
# only; the gateway's own private call keeps working unchanged.
#
# "Keep the health check working" (the one hard requirement on this change) is handled by the
# [checks] table further down, which replaces the old [[http_service.checks]] block one for one:
# same path, method, interval, timeout, and grace period -- what is checked does not change, only
# where the check is declared, since there is no more [http_service] to hang it off of.
#
# STILL REQUIRED, NOT DONE BY THIS FILE, AND NOT SOMETHING THIS SESSION RAN (this session does not
# run `fly` or any deploy command -- CLAUDE.md):
#   1. `fly deploy services/orchestrator --config infra/deploy/fly.orchestrator.toml` -- this
#      change has NO EFFECT until it is redeployed.
#   2. `fly ips list -a oh-orchestrator-rp` after the redeploy -- confirm whether this app still
#      shows an allocated public IPv4/IPv6 (one allocated before [http_service] existed can persist
#      across a config change that stops referencing it). If it does, release it:
#      `fly ips release <ip> -a oh-orchestrator-rp` for each one listed. An allocated-but-unrouted
#      IP should already refuse connections once [http_service] is gone, but an explicit release is
#      the only way to be certain nothing still answers on it.
#   3. Confirm `curl https://oh-orchestrator-rp.fly.dev/health` and
#      `curl -X POST https://oh-orchestrator-rp.fly.dev/query -d '{"question":"test"}'` both fail
#      (refuse/timeout, not a response) while the gateway's own proxied path
#      (`https://<gateway-app>.fly.dev/v1/query`) still works end to end.
#   4. `fly checks list -a oh-orchestrator-rp` -- confirm the health check below is actually
#      registered and passing.
#
# UNVERIFIED, FLAG FOR THE USER: the [checks] table's syntax below is written from documentation
# memory, not confirmed against a live Fly deploy in this session (this session is not permitted to
# run `fly` commands at all, so there was no way to verify it here). Check it against Fly's current
# configuration reference before relying on it, and do not trust this file's syntax as correct
# until `fly checks list` (step 4 above) confirms it after a real deploy -- a change like this is
# not "verified" on the strength of this file reading sensibly; it is verified when the environment
# it targets confirms it.
app = "oh-orchestrator-rp"
primary_region = "iad"

# NOTE: this table must stay ABOVE [env]/[http_service]/[[vm]] with nothing but comments between
# `primary_region` and here -- TOML has no "end of table" marker, so any bare `key = value` line
# appearing AFTER a table header belongs to that table (or its last-opened sub-table) until the
# next header. `app`/`primary_region` above are root keys precisely because nothing opened a table
# before them.
[build]
  [build.args]
    # "gguf" alone (not "dev,eval,gguf", the local dev default) -- this is what keeps ragas,
    # langchain, langgraph, and datasets out of the deployed image while still installing
    # llama-cpp-python, the one extra dependency production's real embedding provider
    # (GGUFEmbedder, see [env] below) actually needs. Confirmed empty otherwise: an image built
    # with this exact value has `importlib.util.find_spec` return None for langgraph, langchain,
    # langchain_core, ragas, datasets, and textstat.
    INSTALL_EXTRAS = "gguf"

# --- Required secrets (set with `fly secrets set NAME=value -a office-hours-orchestrator`,
# NEVER written to this file) ---
#   DATABASE_URL          hosted Postgres with pgvector (e.g. Fly Postgres, Neon, Supabase),
#                         `postgresql://user:pass@host:5432/dbname`
#   OLLAMA_API_KEY        Ollama Cloud API key (primary generator, see [env] below)
#   LLM_FALLBACK_API_KEY  NVIDIA API key (fallback generator, see [env] below)
#   SESSION_HASH_SALT     HMAC key for GET /usage's anonymous session hash
#                         (app/usage.py::hash_session_identifier). MUST be set to the EXACT SAME
#                         value as office-hours-gateway's own SESSION_HASH_SALT secret
#                         (fly.gateway.toml) -- see that file's own comment and
#                         app/main.py::_client_session_hash for why. Settings.SESSION_HASH_SALT's
#                         own code default is a placeholder fine only for local dev; leaving this
#                         unset here means the deployed service silently falls back to that
#                         well-known, non-secret placeholder in production.
#   OTEL_EXPORTER_OTLP_HEADERS   Phase 8 round 4, production observability (Grafana Cloud free
#                         tier). Standard OTLP env var, read automatically by the Python SDK with
#                         NO code change needed (confirmed: OTLPSpanExporter/OTLPMetricExporter
#                         both apply it even when `endpoint` is passed explicitly -- see
#                         app/telemetry.py) -- format `Authorization=Basic <base64 of
#                         instanceID:token>`, from Grafana Cloud's own OTLP integration page.
#                         Secret because it carries the auth token.
#   LANGFUSE_SECRET_KEY   Phase 8 round 4, Langfuse free tier (`sk-lf-...`). See [env] below for
#                         LANGFUSE_HOST/LANGFUSE_PUBLIC_KEY, which are not secret the way this is.
#

# EMBED_PROVIDER/EMBED_GGUF_* ARE set below, in [env]: production's real embedding provider is
# GGUFEmbedder (Phase 8 round 8, docs/adr/0013-in-process-gguf-embeddings.md), loading
# nomic-embed-text's own GGUF file in-process via llama-cpp-python -- no API, no vendor, no third
# machine. Neither Ollama Cloud nor NVIDIA serves nomic-embed-text, and re-embedding the corpus on
# a different model was rejected (the 221 stored vectors are nomic-embed-text 768-dim, and
# NO_ANSWER_MAX_DISTANCE=0.50 already sits knife-edge against a 0.4370 off-topic control -- moving
# to a different embedding space would mean re-deriving that threshold with no way to do so
# safely). The GGUF file itself is baked into the image at build time (see
# services/orchestrator/Dockerfile), never downloaded at container start.
#
# JUDGE_API_KEY is NOT set here: the eval judge (eval/judge.py) is invoked by `python -m eval.run`
# by hand or in CI (.github/workflows/eval.yml), never by the deployed FastAPI service at request
# time, so it has no business being a secret on the serving app.

[env]
  # Production LLM failover chain (Phase 8). PRIMARY: Ollama Cloud, speaking the same /api/chat
  # shape as local Ollama (app/providers/llm.py::OllamaLLM), so LLM_PROVIDER stays "ollama" --
  # only the base URL, OLLAMA_API_KEY (a secret, above), and OLLAMA_CLOUD differ from local dev.
  # FALLBACK: NVIDIA's OpenAI-compatible endpoint (app/providers/llm.py::OpenAICompatLLM), tried
  # once if Ollama Cloud errors, times out, or returns 5xx/429 (app/providers/llm.py::FallbackLLM).
  LLM_PROVIDER = "ollama"
  LLM_MODEL = "gpt-oss:120b"
  OLLAMA_BASE_URL = "https://ollama.com"
  OLLAMA_CLOUD = "true"
  LLM_FALLBACK_PROVIDER = "nvidia"
  LLM_FALLBACK_MODEL = "openai/gpt-oss-20b"
  LLM_FALLBACK_BASE_URL = "https://integrate.api.nvidia.com/v1/chat/completions"
  # A hosted provider needs nowhere near the 600s local default (see app/config.py's own comment
  # on why that default is so high for the local reasoning model).
  LLM_TIMEOUT_SECONDS = "60.0"
  # Production embedding provider (Phase 8 round 8): GGUFEmbedder, loading nomic-embed-text's own
  # GGUF file in-process (see the [build.args]/secrets comments above and
  # docs/adr/0013-in-process-gguf-embeddings.md). EMBED_GGUF_PATH matches exactly where
  # services/orchestrator/Dockerfile's `COPY models ./models` puts the file inside the image.
  # EMBED_GGUF_N_CTX=2048 and EMBED_GGUF_THREADS=1 are the measured serving config: 351MB loaded /
  # 358MB peak, 16.2ms median query embed -- see app/config.py's own comment on
  # Settings.EMBED_GGUF_N_CTX for the full derivation, in particular why n_batch/n_ubatch must
  # never be set separately from n_ctx.
  EMBED_PROVIDER = "gguf"
  EMBED_MODEL = "nomic-embed-text"
  EMBED_GGUF_PATH = "/app/models/nomic-embed-text-f16.gguf"
  EMBED_GGUF_N_CTX = "2048"
  EMBED_GGUF_THREADS = "1"

  ALLOWED_ORIGINS = "https://office-hours-gray.vercel.app"
  # Without this, `fly logs` would never show which provider actually served a request (the
  # llm.primary_failed / llm.served_by lines app/providers/llm.py::FallbackLLM emits) -- see
  # Settings.LOG_LEVEL's own comment in app/config.py.
  LOG_LEVEL = "INFO"

  # --- Production observability (Phase 8 round 4): Grafana Cloud (OTLP) + Langfuse, both free
  # --- tier, neither an extra Fly machine. Off/inert unless the corresponding secret is also set
  # --- (see the secrets comment above) -- app/telemetry.py always exports somewhere (it has no
  # --- "disabled" state), but a dangling exporter with no reachable endpoint at all just retries
  # --- with backoff and drops spans; Langfuse specifically is off by default (absent
  # --- LANGFUSE_PUBLIC_KEY/LANGFUSE_SECRET_KEY = disabled, see app/langfuse_telemetry.py).
  #
  # THE URL RULE (see app/telemetry.py's own comment for the full reasoning): this is the BASE
  # OTLP URL only, e.g. "https://otlp-gateway-prod-us-east-0.grafana.net/otlp" -- NEVER append
  # "/v1/traces" or "/v1/metrics" yourself; both this service and office-hours-gateway append that
  # suffix themselves, using the identical rule, from this same base value. Get the real value from
  # Grafana Cloud's own "OTLP" integration page for your stack.
  OTEL_EXPORTER_OTLP_ENDPOINT = "https://otlp-gateway-prod-us-east-2.grafana.net/otlp"
  # Inert for THIS project's exporter classes (opentelemetry-exporter-otlp-proto-http is already
  # protobuf-over-http unconditionally; this env var only matters to the generic
  # "opentelemetry-exporter-otlp" auto-selecting package, which this project does not use) -- set
  # anyway because Grafana Cloud's own setup instructions list it as required regardless of SDK,
  # and it costs nothing to be consistent with them.
  OTEL_EXPORTER_OTLP_PROTOCOL = "http/protobuf"
  # Langfuse: cloud.langfuse.com (EU) or us.cloud.langfuse.com (US) -- pick whichever region the
  # Langfuse project was actually created in.
  LANGFUSE_HOST = "https://us.cloud.langfuse.com"
  LANGFUSE_PUBLIC_KEY = "pk-lf-4b386122-b6c3-415e-b085-a7d4f7e75001"

# [http_service] REMOVED (see the top-of-file comment on `app`/`primary_region` for the full
# reasoning): this app no longer accepts public HTTP traffic, so there is no public Fly Proxy
# service left to configure. auto_stop_machines/auto_start_machines/min_machines_running do not
# carry over to anything below -- both were about the Fly Proxy deciding to stop or (re-)start a
# machine based on PUBLIC traffic volume, which no longer applies once that public route is gone.
# Without [http_service], a deployed machine simply keeps running once `fly deploy` starts it
# (equivalent, in effect, to the old auto_stop_machines="off"/min_machines_running=1 -- always on,
# nothing to scale to zero), which is exactly the "no cold start" property this app already chose
# deliberately over scale-to-zero before this change, for the same reason: the gateway's own 6PN
# call should never pay a cold-start penalty either.
[checks]
  [checks.health]
    port = 8000
    type = "http"
    method = "get"
    path = "/health"
    interval = "15s"
    timeout = "5s"
    grace_period = "60s"

[[vm]]
  # shared-cpu-1x with 1024MB (Phase 8 round 8: raised from 512MB). The orchestrator holds an
  # httpx client, a psycopg connection pool, and the OpenTelemetry SDK in memory; 512MB was already
  # tight for FastAPI plus those dependencies. GGUFEmbedder (this service's own real embedding
  # provider now, see [env] above) adds a measured 358MB peak on top of that at its serving config
  # (EMBED_GGUF_N_CTX=2048, EMBED_GGUF_THREADS=1) -- 512MB would leave next to nothing for the rest
  # of the process, so this moves to the next Fly size up rather than trim the margin to zero.
  #
  # Cost, iad on-demand pricing: 256MB $1.94/mo, 512MB $3.19/mo, 1GB $5.70/mo. This machine alone
  # goes from $3.19 to $5.70/mo; combined with the gateway's own 256MB machine (fly.gateway.toml,
  # $1.94/mo, unchanged), the whole stack moves from $5.13 to $7.64/mo. The alternative considered
  # -- a third, separate Fly machine dedicated to embeddings -- was rejected partly on cost: even at
  # the smallest usable size (512MB, since it would carry the same ~358MB peak) that is $3.19/mo on
  # top of the ORIGINAL $5.13/mo stack, $10.83/mo total, for a second service, a second deploy
  # target, and a network hop the in-process approach has no need of. See
  # docs/adr/0013-in-process-gguf-embeddings.md.
  size = "shared-cpu-1x"
  memory = "1024mb"
