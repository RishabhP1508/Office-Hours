[project]
name = "office-hours-orchestrator"
version = "0.1.0"
description = "Office Hours orchestrator: retrieval, generation, and the RAG pipeline."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "psycopg[binary,pool]>=3.2",
    "pgvector>=0.3.6",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.3",
    "markdownify>=0.13",
    "pyyaml>=6.0",
    "python-dateutil>=2.9",
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "black>=24.10",
]
# Phase 1 eval harness (eval/run.py, judge.py, metrics.py). This puts eval-only dependencies in the
# service image (see Dockerfile: `pip install -e ".[dev,eval]"`); noted in docs/reports/phase-1.md.
#
# ragas 0.4.x (the current PyPI default) eagerly imports `langchain_community.chat_models.vertexai`
# at import time, a module recent langchain-community releases (0.4.x) no longer ship -- it moved to
# a standalone `langchain-google-vertexai` package. That import fails before ragas.evaluate() is ever
# called. ragas 0.2.15 is the last line before that split and uses the LangchainLLMWrapper /
# LangchainEmbeddingsWrapper interface this project's judge and metrics are built on, so it is
# pinned exactly, together with a langchain-community version old enough to still carry the vertexai
# submodule ragas imports (but not so old it drags in an incompatible langchain-core). All five
# pins below were verified together in a clean virtualenv (no other langchain packages pre-installed)
# to resolve to exactly these versions with no dependency conflicts.
eval = [
    "ragas==0.2.15",
    "langchain==1.3.18",
    "langchain-core==1.6.1",
    "langchain-community==0.3.31",
    "langchain-openai==1.6.0",
    "openai==3.6.0",
    "textstat==0.7.13",
    "datasets==5.0.1",
]
# The CI invariant gate's dependency set (.github/workflows/eval.yml, `pull_request` job): just
# enough of the `eval` extra to run `python -m eval.run --ci` (EVAL_MODE=ci). openai is needed only
# because eval/judge.py imports it at module level even though CI mode never calls the judge (the
# NVIDIA judge client itself is never constructed in CI mode); textstat is needed for
# reading_grade_level, which CI mode does compute. Neither ragas, langchain, langchain-community,
# langchain-openai, nor datasets are installed for this job: eval/metrics.py imports all of those
# lazily, inside the functions that run RAGAS, precisely so CI installs none of them (see
# docs/adr/0004-ci-baselines-vs-aspirational-thresholds.md -- this is the whole reason CI install
# time stays fast). A full local eval run still installs the `eval` extra above, a superset of this
# one with the same pins.
eval-ci = [
    "openai==3.6.0",
    "textstat==0.7.13",
]
# Phase 5 scheduled refresh job (app/recrawl.py, runnable as `python -m app.recrawl`). LangGraph
# drives the per-source fetch/diff/reindex state machine there, checkpointed to a local sqlite file
# so a killed run resumes instead of re-fetching from scratch (see app/recrawl.py's module
# docstring). This extra is installed ONLY by .github/workflows/recrawl.yml and by a developer
# running `python -m app.recrawl` locally -- NEVER by services/orchestrator/Dockerfile (the service
# image that serves /query) and NEVER by CI's invariant gate (.github/workflows/eval.yml's
# `pull_request` job, which installs `[dev,eval-ci]` only). langgraph pulls in langchain-core,
# langgraph-checkpoint, langgraph-prebuilt, langgraph-sdk, langchain-protocol, ormsgpack, orjson,
# websockets, and xxhash as transitive dependencies; none of that may reach app/main.py or
# app/pipeline.py's import graph, or eval/run.py's -- see
# services/orchestrator/tests/test_freshness.py's dependency-isolation test and
# services/orchestrator/tests/test_ci_eval_mode.py's serving-path guard for the tests that enforce
# this. Versions pinned here were verified to install cleanly together on python:3.12-slim.
freshness = [
    "langgraph>=1.2,<2",
    "langgraph-checkpoint-sqlite>=3.1,<4",
    "aiosqlite>=0.20",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

# `eval` and `app` are declared first-party explicitly, rather than left to ruff's isort to infer
# from the directory layout, because that inference is not stable across the two layouts this repo
# is linted in and the two disagree about the same file. Inside the orchestrator image, eval/ is
# bind-mounted as a sibling of app/ and tests/ under the ruff root (docker-compose.yml mounts
# ./eval to /app/eval), so `import eval.run` reads as first-party and belongs in its own group. In
# a bare checkout, eval/ sits two directories above services/orchestrator/, so the same import
# reads as third-party and belongs alphabetised alongside pytest. Those two orderings are mutually
# exclusive, so tests/test_ci_eval_mode.py could not satisfy `ruff check` in both environments at
# once, and which one was clean depended on where it was run. This setting fixes the
# classification, so the ordering is the same everywhere. It disables no rule and loosens nothing;
# I001 is still enforced.
[tool.ruff.lint.isort]
known-first-party = ["app", "eval"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "live_stack: requires a live orchestrator (docker compose or a bare `uvicorn app.main:app`) reachable over HTTP, with a corpus already ingested",
    "full_corpus: requires data/sources/raw/ populated from the real 14-source manifest (data/sources/sources.yaml) via `python -m app.ingest` (INGEST_MODE=fetch); not satisfied by the small eval/fixtures/sources/ corpus the CI invariant gate ingests",
    "freshness: requires the [freshness] extra (langgraph); skipped where it is not installed",
]
